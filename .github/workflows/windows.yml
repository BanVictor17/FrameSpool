name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Prepare pinned build tools
        run: .\setup-build-tools.ps1
      - name: Build self-contained EXE and MSI
        run: .\build.ps1 -Installer
      - name: Verify standalone executable
        run: .\verify.ps1
      - name: Verify portable update helper
        run: .\verify-updater.ps1
      - name: Verify MSI installation, upgrade and uninstall
        run: |
          .\build-msi.ps1 -Version 0.1.9
          .\verify-installer.ps1 -PreviousMsiPath .\dist\release\FrameSpool-0.1.9-win-x64.msi
      - name: Package release assets
        run: .\package-release.ps1
      - name: Upload application and notices
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: FrameSpool-Windows
          path: |
            dist/release/FrameSpool-0.2.3-win-x64.exe
            dist/release/FrameSpool-0.2.3-win-x64.msi
            dist/release/FrameSpool-0.2.3-win-x64-portable.zip
            dist/release/LibRaw-0.22.2-source.zip
            dist/release/SHA256SUMS.txt
          if-no-files-found: error
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: FrameSpool-verification
          path: |
            obj/verification/
            obj/verification-msi/
            obj/verification-updater/
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download verified Windows build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: FrameSpool-Windows
          path: release
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: source
          persist-credentials: false
      - name: Publish release package
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view $env:GITHUB_REF_NAME > $null 2>&1
          if ($LASTEXITCODE -eq 0) { Write-Output 'Release already published.'; exit 0 }
          gh release create $env:GITHUB_REF_NAME .\release\FrameSpool-0.2.3-win-x64.exe .\release\FrameSpool-0.2.3-win-x64.msi .\release\FrameSpool-0.2.3-win-x64-portable.zip .\release\LibRaw-0.22.2-source.zip .\release\SHA256SUMS.txt --verify-tag --title ("FrameSpool " + $env:GITHUB_REF_NAME) --notes-file .\source\RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
